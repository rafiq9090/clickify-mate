[package]
name = "image_verifier"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "image-verifier-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tonic = "0.10"
prost = "0.12"
sha2 = "0.10"
hex = "0.4"
image = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"

[build-dependencies]
tonic-build = "0.10"
