global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'rust-webhook'
    static_configs:
      - targets: ['webhook_rust:5004']
    metrics_path: /metrics

  - job_name: 'go-orchestrator'
    static_configs:
      - targets: ['orchestrator:5001']
    metrics_path: /metrics

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
