services:
  # PostgreSQL - Core Relational Data
  postgres:
    image: postgres:15-alpine
    container_name: telegraph_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: clickify_mate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./supabase/migrations/20260820082635_add_hosted_payment_flow.sql:/docker-entrypoint-initdb.d/20-hosted-payment-flow.sql:ro
      - ./supabase/migrations/20260823061937_production_foundations.sql:/docker-entrypoint-initdb.d/30-production-foundations.sql:ro
      - ./supabase/migrations/20260823070000_knowledge_rag_foundations.sql:/docker-entrypoint-initdb.d/40-knowledge-rag-foundations.sql:ro
      - ./supabase/migrations/20260824000000_add_stripe_gateway.sql:/docker-entrypoint-initdb.d/50-stripe-gateway.sql:ro
      - ./supabase/migrations/20260905000000_add_sslcommerz_gateway.sql:/docker-entrypoint-initdb.d/60-sslcommerz-gateway.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MongoDB - Chat History & Log Records
  mongodb:
    image: mongo:6-jammy
    container_name: telegraph_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  # Redis - High-speed Queue Broker & Session Cache
  redis:
    image: redis:7-alpine
    container_name: telegraph_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Nuxt dashboard and tenant API
  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: telegraph_dashboard
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/clickify_mate
      - MONGODB_URL=mongodb://admin:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}@mongodb:27017/clickify_mate?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is required}
      - ADMIN_USER=${ADMIN_USER:?ADMIN_USER is required}
      - ADMIN_PASS=${ADMIN_PASS:?ADMIN_PASS is required}
      - AGENT_ENCRYPTION_KEY=${AGENT_ENCRYPTION_KEY:?AGENT_ENCRYPTION_KEY is required}
      - PAYMENT_CREDENTIALS_KEY=${PAYMENT_CREDENTIALS_KEY:?PAYMENT_CREDENTIALS_KEY is required}
      - PAYMENT_PUBLIC_BASE_URL=${PAYMENT_PUBLIC_BASE_URL:?PAYMENT_PUBLIC_BASE_URL is required}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - VERIFY_TOKEN=${VERIFY_TOKEN:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - B2_KEY_ID=${B2_KEY_ID:-}
      - B2_APPLICATION_KEY=${B2_APPLICATION_KEY:-}
      - B2_BUCKET_NAME=${B2_BUCKET_NAME:-}
      - B2_REGION=${B2_REGION:-}
      - B2_ENDPOINT=${B2_ENDPOINT:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - AUTH_EMAIL_FROM=${AUTH_EMAIL_FROM:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ALLOW_SIGNUP=${ALLOW_SIGNUP:-false}
      - TELEGRAM_POLLING_ENABLED=${TELEGRAM_POLLING_ENABLED:-false}
      - FIREBASE_SERVICE_ACCOUNT_KEY=${FIREBASE_SERVICE_ACCOUNT_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Python Agent AI Service (FastAPI)
  agent_ai:
    profiles: ["legacy"]
    build:
      context: ./services/agent_ai
      dockerfile: Dockerfile
    container_name: telegraph_agent_ai
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/clickify_mate
      - IMAGE_VERIFIER_URL=image_verifier:5002
      - PYTHONPATH=/app:/app/app/grpc_stubs
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Go Ingestion & Orchestration Service
  orchestrator:
    profiles: ["legacy"]
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    container_name: telegraph_orchestrator
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - PORT=5001
      - GRPC_PORT=5003
      - WHATSAPP_FORWARD_URL=http://agent_ai:8000/webhook/whatsapp
      - TELEGRAM_FORWARD_URL=http://webhook_rust:5004/webhook/telegram
      - FACEBOOK_FORWARD_URL=http://webhook_rust:5004/webhook/facebook
    depends_on:
      redis:
        condition: service_started
      agent_ai:
        condition: service_started
      webhook_rust:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Rust Image Verification Service (OCR & Screenshot fingerprinting)
  image_verifier:
    profiles: ["legacy"]
    build:
      context: ./services/image_verifier
      dockerfile: Dockerfile
    container_name: telegraph_image_verifier
    restart: unless-stopped

  # Rust Webhook & Cryptography Service (AES-256-GCM engine & Webhook dispatcher)
  webhook_rust:
    profiles: ["legacy"]
    build:
      context: ./services/webhook_rust
      dockerfile: Dockerfile
    container_name: telegraph_webhook_rust
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/clickify_mate
      - AGENT_ENCRYPTION_KEY=${AGENT_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Loki - Centralized Log DB
  loki:
    image: grafana/loki:2.9.0
    container_name: telegraph_loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # Promtail - Log Shipping Agent
  promtail:
    image: grafana/promtail:3.0.0
    container_name: telegraph_promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  # Prometheus - Metrics Scraping Server
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: telegraph_prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  # Alertmanager - Alert routing
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: telegraph_alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    restart: unless-stopped

  # Grafana - Dashboards & Visualization UI
  grafana:
    image: grafana/grafana:10.1.0
    container_name: telegraph_grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  loki_data:
  grafana_data:
  prometheus_data:

